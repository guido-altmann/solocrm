name: Build & Test

# Feature branches are built via their PR only; a push trigger for all branches would build every PR commit twice.
# Changes that affect neither build, tests nor image (docs, editor settings, dev compose) do not trigger a run.
on:
  push:
    branches: [main]
    paths-ignore: &non-build-paths
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
      - ".vscode/**"
      - ".idea/**"
      - ".github/dependabot.yml"
      - "deploy/docker-compose.dev.yml"
  pull_request:
    paths-ignore: *non-build-paths
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Actions are pinned to commit SHAs (SOL-33); Dependabot keeps SHA and version comment up to date.
env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # GitVersion needs the full history and tags.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      # Includes integration tests: Testcontainers uses the Docker daemon of the hosted runner.
      # Coverage of Domain and Application is measured and reported, not enforced (iteration 6 decision 9).
      - name: Test
        run: >-
          dotnet test --no-build -c Release
          --coverage --coverage-output-format cobertura --coverage-settings tests/coverage.config
          --results-directory TestResults

      - name: Coverage summary
        if: always()
        run: |
          if ls TestResults/*.cobertura.xml > /dev/null 2>&1; then
            python3 tests/coverage-summary.py TestResults/*.cobertura.xml | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: TestResults/*.cobertura.xml
          if-no-files-found: ignore
          retention-days: 30

  # Complements GitHub secret scanning (provider tokens, push protection) with generic patterns
  # such as passwords in connection strings. False positives go into .gitleaksignore (SOL-33).
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
