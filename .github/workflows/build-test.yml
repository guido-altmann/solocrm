name: Build & Test

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      # Includes integration tests: Testcontainers uses the Docker daemon of the hosted runner.
      # Coverage of Domain and Application is measured and reported, not enforced (iteration 6 decision 9).
      - name: Test
        run: >-
          dotnet test --no-build -c Release
          --coverage --coverage-output-format cobertura --coverage-settings tests/coverage.config
          --results-directory TestResults

      - name: Coverage summary
        if: always()
        run: |
          if ls TestResults/*.cobertura.xml > /dev/null 2>&1; then
            python3 tests/coverage-summary.py TestResults/*.cobertura.xml | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: TestResults/*.cobertura.xml
          if-no-files-found: ignore
          retention-days: 30
