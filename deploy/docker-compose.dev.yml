# Local development dependencies for SoloCRM.
# Start: docker compose -f deploy/docker-compose.dev.yml up -d
# Credentials match src/SoloCrm.Web/appsettings.Development.json (local use only).
name: solocrm-dev

services:
  postgres:
    image: postgres:17-alpine
    container_name: solocrm-postgres
    environment:
      POSTGRES_USER: solocrm
      POSTGRES_PASSWORD: solocrm
      POSTGRES_DB: solocrm
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solocrm -d solocrm"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
